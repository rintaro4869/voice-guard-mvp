name: SEO Contract

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - sitemap.xml
      - scripts/check-seo-contract.mjs
      - .github/workflows/seo-contract.yml
  pull_request:
    paths:
      - index.html
      - sitemap.xml
      - scripts/check-seo-contract.mjs
      - .github/workflows/seo-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-homepage-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify SEO contract
        run: node scripts/check-seo-contract.mjs
