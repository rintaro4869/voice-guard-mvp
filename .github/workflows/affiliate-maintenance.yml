name: Affiliate Maintenance

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affiliate-maintenance
  cancel-in-progress: false

jobs:
  check-affiliate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      config-changed: ${{ steps.config-diff.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run security regression tests
        run: node --test scripts/check-affiliates.test.mjs

      - name: Check affiliate links
        run: node scripts/check-affiliates.mjs --write

      - name: Publish report to workflow summary
        run: cat reports/affiliate-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Detect config changes
        id: config-diff
        run: |
          if git diff --quiet -- assets/affiliate-links.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reviewed config candidate
        if: steps.config-diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affiliate-links-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: assets/affiliate-links.json
          if-no-files-found: error
          retention-days: 1

  commit-affiliate-links:
    needs: check-affiliate-links
    if: >-
      needs.check-affiliate-links.outputs.config-changed == 'true' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download config candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: affiliate-links-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: .workflow-artifact

      - name: Validate and stage config candidate
        run: |
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('.workflow-artifact/affiliate-links.json','utf8')); if (!value || Array.isArray(value) || typeof value !== 'object') process.exit(1)"
          cp .workflow-artifact/affiliate-links.json assets/affiliate-links.json

      - name: Commit config changes
        run: |
          if git diff --quiet -- assets/affiliate-links.json; then
            echo "No affiliate config changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/affiliate-links.json
          git commit -m "chore: refresh affiliate link status"
          git push
